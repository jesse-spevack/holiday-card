<main id="app">
  <header class="bar">
    <span></span>

      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M4 9h4l5-4v14l-5-4H4z"></path><path class="wave" d="M17 9c1.5 1.5 1.5 4.5 0 6"></path><path class="mute" d="M16 9l6 6M22 9l-6 6"></path></svg>
    </button>
  </header>
  <section class="stage" id="stage" aria-label="Our holiday party">
    <div class="world" id="world">
      <canvas id="canvas" width="256" height="192" aria-hidden="true"></canvas>
      <div class="overlay" id="overlay"></div>
    </div>
  </section>
  <section class="dialog" id="dialog" aria-live="polite"></section>
  <div class="turnstile" id="turnstile"></div>
</main>
